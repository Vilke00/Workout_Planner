name: GymPlan
options:
  bundleIdPrefix: com.gymplan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX
    from: 0.14.1

targets:
  GymPlan:
    type: application
    platform: iOS
    sources:
      - path: GymPlan
      - path: Shared
      - path: ExerciseData/exercises.json
        buildPhase: resources
      - path: ExerciseImages
        type: folder
        buildPhase: resources
    dependencies:
      - package: CoreXLSX
      - target: GymPlanWidgets
    info:
      path: GymPlan/Info.plist
      properties:
        CFBundleDisplayName: Gym Plan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Workout Table
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.spreadsheetml.sheet
              - public.comma-separated-values-text
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymplan.app
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAIN_APP"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Manual

  GymPlanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GymPlanWidgets
      - path: Shared
    info:
      path: GymPlanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Gym Plan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymplan.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES

schemes:
  GymPlan:
    build:
      targets:
        GymPlan: all
    run:
      config: Debug
    archive:
      config: Release
